name: EAS Build

on:
  push:
    branches:
      - master
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Set Expo Token
        run: echo "EXPO_TOKEN=${{ secrets.EXPO_TOKEN }}" >> $GITHUB_ENV

      - name: Run EAS Build
        run: |
          if [ "${{ github.ref }}" == "refs/heads/master" ]; then
            echo "Building production (master)"
            eas build -p android -e preview --non-interactive --wait
          elif [ "${{ github.ref }}" == "refs/heads/dev" ]; then
            echo "Building preview (dev)"
            eas build -p android -e preview --non-interactive --wait
          fi

      - name: Download latest build artifact
        run: |
          set -e
          BUILD_ID=$(eas build:list --platform android --status finished --json --limit 1 --non-interactive | jq -r '.[0].id')
          if [ -z "$BUILD_ID" ] || [ "$BUILD_ID" = "null" ]; then
            echo "No completed build found. Exiting."
            exit 1
          fi
          echo "Latest build id: $BUILD_ID"

          # Download the build - try without explicit path first
          echo "Downloading build $BUILD_ID..."
          eas build:download "$BUILD_ID"

          # Find the downloaded file and rename it
          DOWNLOADED_FILE=$(find . -name "*.apk" -type f -exec basename {} \; | head -1)
          if [ -n "$DOWNLOADED_FILE" ]; then
            echo "Found downloaded file: $DOWNLOADED_FILE"
            mv "$DOWNLOADED_FILE" "Tanaw-${{ github.ref_name }}.apk"
          else
            echo "No APK file found after download"
            exit 1
          fi

      - name: Upload APK to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Tanaw-${{ github.ref_name }}
          path: Tanaw-${{ github.ref_name }}.apk
